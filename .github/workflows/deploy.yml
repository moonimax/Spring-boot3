name: deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:          # Actions 화면에서 수동 실행 가능

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 리포 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Spring Boot 이미지 빌드 & 푸시
      - name: Build & Push Spring Boot Image
        uses: docker/build-push-action@v6
        with:
          context: ./springboot-app2
          file: ./springboot-app2/Dockerfile
          push: true
          tags: moonimax/springboot2-web2:2.0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH로 EC2 접속 → docker compose 배포
      - name: Deploy via SSH (compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e

            # docker-compose.yml이 있는 서버 폴더
            DEPLOY_DIR="$HOME/springboot2"

            echo "===== 환경 확인 ====="
            whoami
            docker --version
            docker compose version

            echo "===== 배포 폴더 이동 ====="
            cd "$DEPLOY_DIR"
            ls -al

            # (Docker Hub 레포가 비공개일 때만 주석 해제)
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "===== 최신 이미지 pull ====="
            docker compose pull

            echo "===== 컨테이너 기동 ====="
            docker compose up -d --no-build --remove-orphans

            echo "===== 상태 확인 ====="
            docker compose ps

            echo "===== 사용하지 않는 이미지 정리 ====="
            docker image prune -f

            echo "===== web 최근 로그 ====="
            sleep 10
            docker compose logs --tail=50 --no-color web